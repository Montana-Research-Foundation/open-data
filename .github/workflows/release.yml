name: release
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment directory name, e.g. MRF-2026-04-task-design-collapse (required)"
        type: string
        required: true
      environment:
        description: "Zenodo target"
        type: choice
        options: [sandbox, production]
        default: sandbox
      publish:
        description: "Publish the deposit (mints the real DOI; irreversible on production)"
        type: boolean
        default: false
      new_version:
        description: "Deposit a new version of the named, already published experiment (requires its concept DOI in CITATION.cff)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate before depositing
        run: python .github/scripts/validate_release.py
      - name: Check token is configured
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ZENODO_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
      - name: Check an experiment was named
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          if [ -z "$EXPERIMENT" ]; then
            echo "::error::Name the experiment to deposit. This workflow never falls back to depositing all of them: a Zenodo deposit mints a new record, so a bare run would duplicate every published experiment and orphan its DOI."
            exit 1
          fi
      - name: Show the plan (no token, no network)
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          NV=""
          [ "${{ inputs.new_version }}" = "true" ] && NV="--new-version"
          python .github/scripts/zenodo_deposit.py --experiment "$EXPERIMENT" \
            $NV --dry-run --summary "$GITHUB_STEP_SUMMARY"
      - name: Deposit the named experiment
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          BASE=https://sandbox.zenodo.org
          [ "${{ inputs.environment }}" = "production" ] && BASE=https://zenodo.org
          PUB=""
          [ "${{ inputs.publish }}" = "true" ] && PUB="--publish"
          NV=""
          [ "${{ inputs.new_version }}" = "true" ] && NV="--new-version"
          echo "target: $BASE  publish: ${{ inputs.publish }}  new_version: ${{ inputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          python .github/scripts/zenodo_deposit.py --experiment "$EXPERIMENT" \
            $NV --base-url "$BASE" $PUB --summary "$GITHUB_STEP_SUMMARY" --out dois.json
      - name: Upload DOIs
        uses: actions/upload-artifact@v4
        with:
          name: dois
          path: dois.json
